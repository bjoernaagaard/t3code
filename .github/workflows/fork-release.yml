name: Fork release

# A macOS arm64 nightly of the fork, published as a prerelease on this
# repository. The fork has no Clerk, relay or tracing config, so those inputs
# are empty and the features stay off. Without the Apple secrets the build is
# unsigned, exactly as release-desktop.yml decides.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the commit that triggered the run.
        required: false
        type: string

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  bundle:
    name: Build JS bundle
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.release_meta.outputs.ref }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # The fork's identity reaches the build through .env, which loadRepoEnv
      # reads. It is committed only on a release source branch, because a
      # tracked .env would also change what upstream's tests see.
      - id: release_meta
        name: Resolve nightly version and the release source commit
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/desktop/package.json)-nightly.$(date -u +%Y%m%d).${{ github.run_number }}"
          printf 'T3CODE_DISTRIBUTION=fork\n' > .env
          git config user.name "fork-release"
          git config user.email "fork-release@users.noreply.github.com"
          git add -f .env
          git commit -q -m "release: fork distribution $version"
          git push -q origin "HEAD:refs/heads/release-src/$version"
          {
            echo "ref=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}"

      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - run: vp run build:desktop

      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: bundle
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ needs.bundle.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false

  publish:
    name: Publish GitHub prerelease
    needs: [bundle, desktop_mac_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-mac-arm64
          path: release-assets

      # nightly-mac.yml is the feed the installed app reads; listing it by name
      # fails the publish if the build stopped writing it.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bundle.outputs.tag }}
          target_commitish: ${{ needs.bundle.outputs.ref }}
          name: T3 Code Fork Nightly ${{ needs.bundle.outputs.version }}
          body: Built from `${{ needs.bundle.outputs.ref }}`.
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/nightly-mac.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}
